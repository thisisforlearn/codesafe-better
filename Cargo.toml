[package]
name = "codeguard"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Verification-first repair and optimization engine for agentic coding across Python, Rust and C++"
readme = "README.md"
license = "GPL-3.0-only"
repository = "https://github.com/thisisforlearn/codesafe-better"
authors = ["Vaibhav Agarwal"]
keywords = ["agentic-coding", "static-analysis", "testing", "benchmark", "autofix"]
categories = ["development-tools::quality", "development-tools::testing"]

[[bin]]
name = "codeguard"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
which = "6"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[workspace]
