name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: codeguard-linux-x86_64
            rust: stable
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: codeguard-linux-aarch64
            rust: stable
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: codeguard-macos-x86_64
            rust: stable
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: codeguard-macos-aarch64
            rust: stable
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: codeguard-windows-x86_64.exe
            rust: stable

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Install cross linker (arm64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/codeguard.exe ${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/codeguard ${{ matrix.artifact }}
          fi

      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} ${{ matrix.artifact }} --repo thisisforlearn/codesafe-better
